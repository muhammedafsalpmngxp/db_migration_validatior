# Streamlit server settings. Every one of these can be overridden by an environment
# variable (STREAMLIT_SERVER_*), which is how docker-compose changes them per deployment.

[server]
# Listen on every interface: inside a container, 127.0.0.1 would be unreachable from the
# host, and on EC2 unreachable from anywhere.
address = "0.0.0.0"
port = 8501
headless = true

# CORS: disabled, which in Streamlit means "allow any origin" - the server answers with
# `Access-Control-Allow-Origin: *` and accepts a WebSocket connection from any origin.
#
# Understand what this gives up before leaving it on a public address: any web page a
# user of this app visits can open a WebSocket to it and drive the app as that user -
# running comparisons, reading the schema and the report. XSRF protection below does not
# stop that (it covers form posts and file uploads, not the WebSocket).
#
# On EC2 this is only safe if the port is not open to the world. Restrict port 8501 in
# the security group to your office or VPN range, or put the app behind an authenticating
# proxy. To lock CORS down instead, set enableCORS = true and list the origins in
# corsAllowedOrigins below.
enableCORS = false
# corsAllowedOrigins = ["https://dbcompare.internal.example.com"]

# Kept on: it still protects the file upload route and form posts, and costs nothing.
enableXsrfProtection = true

# The app reads whole tables into memory to diff them; uploads are not part of the flow.
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
# A stack trace in the browser would leak connection strings and schema names.
showErrorDetails = "stacktrace"

[theme]
base = "dark"
