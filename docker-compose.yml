# DBCompare on a single host (an EC2 instance, or a laptop).
#
#   docker compose up -d --build
#   docker compose logs -f
#
# Configuration comes from .env next to this file. That file is NOT baked into the image
# (see .dockerignore) - it is mounted at runtime, so the same image can be promoted
# between environments and a rebuilt image never carries a key.

services:
  dbcompare:
    build:
      context: .
      dockerfile: Dockerfile
      # EC2 is x86_64 unless the instance is Graviton; set DOCKER_PLATFORM=linux/arm64
      # in .env for a Graviton host, or when building on an Apple Silicon laptop for one.
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    image: dbcompare:latest
    container_name: dbcompare
    restart: unless-stopped

    # Order matters, and it is the order the application expects:
    #   1. env_file       - .env, read by compose into the container's environment
    #   2. environment    - the host's variables as a fallback for anything .env omits
    #   3. config.py      - re-reads the mounted .env with override=True at import
    # So a key in .env always wins; a key only in the host environment is still picked
    # up; and the Streamlit sidebar still beats both for the current session.
    env_file:
      - path: .env
        required: false

    environment:
      # `${VAR:-}` passes the host's value when it has one and an empty string otherwise,
      # which config.py treats as unset. This is the "else system environment" half.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}

      # Inside a container the driver is always Microsoft's own; do not let a value
      # copied from a Windows .env (the legacy "SQL Server" driver) reach it.
      MSSQL_DRIVER: ODBC Driver 18 for SQL Server

      # Overriding the config.toml above without rebuilding: set CORS_ORIGINS in .env to
      # a comma separated list and flip these two to lock the app down.
      STREAMLIT_SERVER_ENABLE_C_O_R_S: ${STREAMLIT_ENABLE_CORS:-false}
      STREAMLIT_SERVER_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-}
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"

    ports:
      # Bind to all interfaces so the EC2 security group is what decides who can reach
      # it. To expose it only through a reverse proxy on the same host, use
      # "127.0.0.1:8501:8501" instead.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8501}:8501"

    volumes:
      # Read-only: the app never writes its configuration, and a container should not be
      # able to rewrite the host's credentials.
      - ./.env:/app/.env:ro
      # Logs survive a container replacement, which is the point of having them.
      - ./logs:/app/logs

    # The databases are external (RDS), so nothing here needs a network of its own.
    # Modest limits: the row diff holds both sides in memory, and an unbounded container
    # on a small instance takes the host down with it.
    deploy:
      resources:
        limits:
          memory: 2g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
