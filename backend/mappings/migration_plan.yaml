# Migration plan: which source tables become which target tables.
#
# This file holds only the mapping. Everything shown about a table - whether it exists,
# its row count, its columns and their types - is read live from the database.
#
# Databases (names come from backend/.env):
#   A = source  DB_SOURCE_A_NAME  (AppMasterDB_UAT)
#   B = source  DB_SOURCE_B_NAME  (AppMasterEngDB_Local)
#   T = target  DB_TARGET_NAME    (AlTasnimBI)
#
# Tables are written <side>.<schema>.<table> and matched case-insensitively. The source
# tables listed here, in this order, are the migration scope; no other table is shown.
#
# Mapping types
#   one_to_one  one source table -> one target table (renamed and/or moved schema)
#   union       several source tables stacked into one target (target rows = sum)
#   merge       a driving table enriched from a lookup (target rows = driving table rows)
#   transform   several sources -> several targets through business logic (no count rule)
#   excluded    in scope, deliberately not migrated (no targets)
#
# columns (optional) declares renames no naming rule can work out, e.g.
#     columns: {Description: crew_type_name, "Nationals/Expats": nationality_type}
# Undeclared columns are paired by name: exact, case, ignoring _ and spaces, and finally
# by the target's naming convention (Supervisor -> supervisor_id), shown as "inferred".

mappings:

  # ---- AppMasterDB_UAT ------------------------------------------------------------

  - id: activity_codes_norms
    type: one_to_one
    sources: [A.dbo.ActivityCodesNorms]
    targets: [T.dbo.activity_codes_norms]

