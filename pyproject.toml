[project]
name = "dbcompare"
version = "0.1.0"
description = "Agentic SQL Server database comparison built on PocketFlow, with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pocketflow>=0.0.2",
    "pyodbc>=5.1.0",
    "streamlit>=1.36.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
addopts = "-v"
